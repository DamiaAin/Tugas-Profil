<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran</title>
</head>
<body>

    <h2>Formulir Pendaftaran Anggota Baru</h2>

    <form>

        <!-- Nama Lengkap -->
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Isi nama Anda">
        <br><br>

        <!-- Alamat Email -->
        <label for="email">Alamat Email:</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com">
        <br><br>

        <!-- Kata Sandi -->
        <label for="password">Kata Sandi:</label>
        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi">
        <br><br>

        <!-- Minat Utama -->
        <p>Pilih Minat Utama (Satu):</p>

        <input type="radio" id="web" name="minat" value="Pengembangan Web">
        <label for="web">Pengembangan Web</label>
        <input type="radio" id="desain" name="minat" value="Desain Grafis">
        <label for="desain">Desain Grafis</label>
        <br>
        <input type="radio" id="kriptografi" name="minat" value="Kriptografi">
        <label for="kriptografi">Kriptografi</label>
        <input type="radio" id="data" name="minat" value="Analis Data">
        <label for="data">Analis Data</label>
        <br><br>

        <!-- Area Keahlian -->
        <p>Area Keahlian (Pilih semua yang sesuai):</p>

        <input type="checkbox" id="html" name="keahlian" value="HTML/CSS">
        <label for="html">HTML/CSS</label>
        <input type="checkbox" id="javascript" name="keahlian" value="JavaScript/Node.js">
        <label for="javascript">JavaScript/Node.js</label>
        <input type="checkbox" id="python" name="keahlian" value="Python">
        <label for="python">Python</label>
        <br>
        <input type="checkbox" id="uiux" name="keahlian" value="Desain UI/UX">
        <label for="uiux">Desain UI/UX</label>
        <input type="checkbox" id="marketing" name="keahlian" value="Pemasaran Digital">
        <label for="marketing">Pemasaran Digital</label>
        <br><br>

        <!-- Negara Asal -->
        <label for="negara">Negara Asal:</label><br>

        <select id="negara" name="negara">
            <option value="">Pilih Negara</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Singapura">Singapura</option>
        </select>
        <br><br>

        <!-- Tombol Daftar -->
        <input type="submit" value="Daftar Sekarang">

    </form>

</body>
</html>
